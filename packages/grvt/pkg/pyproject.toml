[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typed-grvt"
version = "0.1.0"
authors = [
  {name="Marcel Claramunt", email="marcel@tribulnation.com"}
]
description = "A fully typed, validated async client for the GRVT API."
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "typed-core>=0.13", "lazy-loader", "eth-account>=0.13", "httpx>=0.26", "pydantic>=2.7",
]
requires-python = ">=3.10"
readme = {file="README.md", content-type="text/markdown"}

[tool.setuptools.package-data]
"typed_grvt" = ["py.typed", "*.pyi", "**/*.pyi"]

[project.urls]
Repository = "https://github.com/tribulnation/typed"
Documentation = "https://tribulnation.com/typed/grvt"
Website = "https://tribulnation.com/typed"
