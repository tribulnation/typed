[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typed-bitget"
version = "0.1.5"
authors = [
  {name="Marcel Claramunt", email="marcel@tribulnation.com"}
]
description = "A fully typed, validated async client for the Bitget API."
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "typed-core", "lazy-loader",
]
requires-python = ">=3.10"
readme = {file="README.md", content-type="text/markdown"}

[tool.setuptools.package-data]
"bitget" = ["py.typed", "*.pyi", "**/*.pyi"]

[project.urls]
Repository = "https://github.com/tribulnation/bitget.git"
Documentation = "https://bitget.tribulnation.com"
Website = "https://tribulnation.com"
