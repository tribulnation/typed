env_setup:
  body: >-
    Create a `.env` with your API credentials, see
    [API keys setup](/typed/bitget/api-keys) for how to create them.
  code: |
    # .env
    BITGET_ACCESS_KEY="your_access_key"
    BITGET_SECRET_KEY="your_secret_key"
    BITGET_PASSPHRASE="your_passphrase"

install:
  body: Install the client and `python-dotenv` to load the `.env` file.
  code: pip install typed-bitget python-dotenv

first_call:
  body: Load the environment, then make your first call. Examples below use UTA v3, Bitget's recommended surface for new integrations.
  code: |
    from dotenv import load_dotenv
    from typed_bitget import Bitget

    load_dotenv()

    async with Bitget.new() as client:
      tickers = await client.uta.market.tickers(category='SPOT', symbol='BTCUSDT')
      print(tickers)

how_tos:
  - title: Fetch market data
    body: Instruments, order book, candles, tickers, recent trades, all public, no credentials needed.
    code: |
      instruments = await client.uta.market.instruments(category='SPOT', symbol='BTCUSDT')  # trading rules
      book = await client.uta.market.orderbook(category='SPOT', symbol='BTCUSDT')            # order book
      candles = await client.uta.market.candles.recent(category='SPOT', symbol='BTCUSDT', interval='1m')  # candles
      trades = await client.uta.market.fills(category='SPOT', symbol='BTCUSDT')              # recent trades

  - title: Listen to streams
    body: A public channel and the private order/fill feed, over independent WebSocket connections.
    code: |
      async with client.uta_streams.ticker(inst_type='spot', symbol='BTCUSDT') as stream:  # public ticker
        async for push in stream:
          print(push['data'])
      async with client.uta_streams.orders(inst_type='UTA') as stream:  # private order updates
        async for push in stream:
          print(push['data'])

  - title: Place & manage orders
    body: Submit, inspect, list, and cancel orders. Needs credentials.
    code: |
      from decimal import Decimal

      order = await client.uta.trade.order.place({                    # place an order
        'category': 'SPOT', 'symbol': 'BTCUSDT', 'side': 'buy',
        'orderType': 'limit', 'qty': Decimal('0.001'), 'price': Decimal('20000'), 'timeInForce': 'gtc',
      })
      info = await client.uta.trade.order.info(order_id=order['orderId'])  # check its status
      open_orders = await client.uta.trade.order.unfilled(category='SPOT')  # list open orders
      await client.uta.trade.order.cancel(order_id=order['orderId'], category='SPOT')  # cancel it

  - title: Fetch account data
    body: Balances, positions, and financial records. Needs credentials.
    code: |
      assets = await client.uta.account.assets()                                 # balances
      positions = await client.uta.position.current_positions(category='USDT-FUTURES')  # open futures positions
      records = await client.uta.account.financial_records(category='SPOT')      # financial records

  - title: Query & manage earn instruments
    body: List, subscribe to, and redeem Elite structured products. Needs credentials.
    code: |
      products = await client.uta.earn.elite.products()                          # list products
      holdings = await client.uta.earn.elite.assets()                            # current holdings
      sub_info = await client.uta.earn.elite.subscribe_info(product_id=products[0]['productId'])  # subscription terms
      result = await client.uta.earn.elite.subscribe(                          # subscribe
        product_sub_id=sub_info['productSubId'], amount=10.0, payment_accounts='unified',
      )

  - title: Query & manage deposits/withdrawals
    body: Deposit addresses and history, withdrawals, and internal transfers. Needs credentials.
    code: |
      from datetime import datetime, timezone

      address = await client.uta.transfers.deposit.address(coin='USDT', chain='TRC20')  # deposit address
      deposits = await client.uta.transfers.deposit.records(
        start_time=datetime(2023, 11, 14, tzinfo=timezone.utc), end_time=datetime(2023, 11, 15, tzinfo=timezone.utc),
      )  # deposit history
      await client.uta.transfers.withdraw.submit(                                      # withdraw
        coin='USDT', chain='TRC20', transfer_type='on_chain',
        address='your_destination_address', size='10',
      )

  - title: Paginate through results
    body: Automatic cursor- and window-paged iteration over multi-page results.
    code: |
      async for page in client.uta.trade.order.history_paged(category='SPOT', symbol='BTCUSDT'):  # walk every page
        for order in page:
          print(order['orderId'])
