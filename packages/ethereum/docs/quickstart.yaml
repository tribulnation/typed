env_setup:
  body: Public node reads require no credentials or funded wallet.
  code: '# No environment variables required.'

install:
  body: Install the async EVM node wrapper.
  code: pip install 'typed-ethereum>=0.2.0'

first_call:
  body: Read a native balance as Decimal using a public Ethereum node.
  code: |
    from typed_ethereum import NodeRpc

    async with NodeRpc.public_node('ethereum') as client:
      balance = await client.eth_balance('0xde0B295669a9FD93d5F28D9Ec85E40f4cb697BAe')
      print(balance)

how_tos:
  - title: Read another EVM network
    body: The balance helper returns the chosen network's native-asset units.
    code: |
      async with NodeRpc.public_node('arbitrum') as client:
        balance = await client.eth_balance('0xde0B295669a9FD93d5F28D9Ec85E40f4cb697BAe')
        print(balance)
