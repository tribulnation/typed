[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typed-extended"
version = "0.1.0"
authors = [
  {name="Marcel Claramunt", email="marcel@tribulnation.com"}
]
description = "A fully typed, validated async client for the Extended API."
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "typed-core>=0.13.0", "lazy-loader",
]
requires-python = ">=3.10"
readme = {file="README.md", content-type="text/markdown"}

[project.optional-dependencies]
fast = ["fast-stark-crypto>=0.5,<0.6"]

[tool.setuptools.package-data]
"typed_extended" = ["py.typed", "*.pyi", "**/*.pyi"]

[project.urls]
Repository = "https://github.com/tribulnation/typed"
Documentation = "https://tribulnation.com/typed/extended"
Website = "https://tribulnation.com/typed"
