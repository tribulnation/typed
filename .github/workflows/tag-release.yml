name: Tag releases
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch --tags
      - name: Tag any package whose version isn't tagged yet
        run: |
          for pyproject in packages/core/pyproject.toml packages/*/pkg/pyproject.toml; do
            [ -f "$pyproject" ] || continue
            if [ "$pyproject" = "packages/core/pyproject.toml" ]; then
              slug=core
            else
              slug=$(echo "$pyproject" | cut -d/ -f2)
            fi
            version=$(grep -m1 '^version = ' "$pyproject" | sed -E 's/version = "(.*)"/\1/')
            tag="${slug}-v${version}"
            if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
              echo "$tag already exists, skipping"
            else
              echo "Tagging $tag"
              git tag "$tag"
              git push origin "$tag"
            fi
          done
