name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          packages=$(git diff --name-only "$base" HEAD -- packages/ | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
  check:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: dir
        run: |
          if [ "${{ matrix.package }}" = "core" ]; then
            echo "path=packages/core" >> "$GITHUB_OUTPUT"
          else
            echo "path=packages/${{ matrix.package }}/pkg" >> "$GITHUB_OUTPUT"
          fi
      - run: pip install -e "packages/core[grpc]"
      - run: pip install -e ${{ steps.dir.outputs.path }}
      - run: pip install ruff pyright pytest
      - run: ruff check --select TID251 ${{ steps.dir.outputs.path }}
      - run: pyright ${{ steps.dir.outputs.path }}
