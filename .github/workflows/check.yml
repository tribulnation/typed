name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            alchemy: 'packages/alchemy/**'
            binance: 'packages/binance/**'
            bit2me: 'packages/bit2me/**'
            bitget: 'packages/bitget/**'
            bybit: 'packages/bybit/**'
            coinbase: 'packages/coinbase/**'
            core: 'packages/core/**'
            cosmos: 'packages/cosmos/**'
            deribit: 'packages/deribit/**'
            dydx: 'packages/dydx/**'
            ethereum: 'packages/ethereum/**'
            etherscan: 'packages/etherscan/**'
            hyperliquid: 'packages/hyperliquid/**'
            kraken: 'packages/kraken/**'
            kucoin: 'packages/kucoin/**'
            mexc: 'packages/mexc/**'
            moralis: 'packages/moralis/**'
  check:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: dir
        run: |
          if [ "${{ matrix.package }}" = "core" ]; then
            echo "path=packages/core" >> "$GITHUB_OUTPUT"
          else
            echo "path=packages/${{ matrix.package }}/pkg" >> "$GITHUB_OUTPUT"
          fi
      - run: pip install -e packages/core
      - run: pip install -e ${{ steps.dir.outputs.path }}
      - run: pip install ruff pyright
      - run: ruff check --select TID251 ${{ steps.dir.outputs.path }}
      - run: pyright ${{ steps.dir.outputs.path }}
