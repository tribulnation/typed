name: Release binance
on:
  push:
    tags: ['binance-v*']
permissions:
  id-token: write
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e packages/core
      - run: pip install -e packages/binance/pkg
      - run: pip install ruff pyright build
      - run: ruff check --select TID251 packages/binance/pkg
      - run: pyright packages/binance/pkg
      - run: cp packages/binance/README.md packages/binance/LICENSE packages/binance/pkg/
      - run: python -m build packages/binance/pkg
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/binance/pkg/dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
