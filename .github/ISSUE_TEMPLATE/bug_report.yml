name: Bug Report
description: Report a bug in a typed package
body:
  - type: markdown
    attributes:
      value: |
        Found a bug in generated code (files under `packages/<slug>/pkg/src/typed_<slug>/`
        that start with `# Generated by typed-dev`)? File it here instead of opening a PR.
        The next generation run would overwrite a hand-applied fix. See CONTRIBUTING.md.
  - type: input
    id: package-version
    attributes:
      label: Package & version
      placeholder: typed-binance==0.2.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The failing call, the response that didn't validate, the type that didn't match.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: python
